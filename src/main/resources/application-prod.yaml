# ── Production overrides ──────────────────────────────────────────────────────
# Activate with SPRING_PROFILES_ACTIVE=prod. Tightens what the base profile
# leaves developer-friendly: no internal exception messages or binding errors in
# HTTP responses, and INFO-level logging only.

server:
  error:
    include-message: never
    include-binding-errors: never
  # Behind a reverse proxy / load balancer (the normal hosted topology), set
  # SERVER_FORWARD_HEADERS_STRATEGY=framework so X-Forwarded-For resolves the
  # real client IP — otherwise every user shares the proxy's IP and the auth
  # rate limiter throttles them collectively. Leave 'none' (default) ONLY when
  # the app terminates TLS itself, where honouring client-supplied
  # X-Forwarded-For would let attackers spoof their way past the limiter.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

logging:
  level:
    com.nexuscommerce: INFO
    org.springframework.security: WARN
