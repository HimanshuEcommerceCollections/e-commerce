spring:
  application:
    name: nexus-commerce

  # ── Datasource ────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_commerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexusHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # use 'validate' in production with Flyway/Liquibase
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

# ── Application-level JWT properties ─────────────────────────────────────────
app:
  jwt:
    # Minimum 256-bit (32-char) secret. Override via env var JWT_SECRET in production.
    secret: ${JWT_SECRET:5468576D5A7134743777217A25432A462D4A614E645267556B58703272357538}
    # Access token lifetime in milliseconds (default 24 h)
    expiration: ${JWT_EXPIRATION_MS:86400000}
    # Refresh token lifetime in milliseconds (default 7 days)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.nexuscommerce: DEBUG
    org.springframework.security: INFO
