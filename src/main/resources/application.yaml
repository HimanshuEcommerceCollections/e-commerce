spring:
  application:
    name: nexus-commerce

  # ── Datasource ────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexus_commerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexusHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── Schema migrations (Flyway) ──────────────────────────────────────────────
  # Flyway owns the schema; Hibernate only validates against it (ddl-auto: validate).
  # baseline-on-migrate lets an existing (pre-Flyway) database adopt migrations:
  # it is baselined at V1 (assumed already present) and only V2+ are applied. A
  # fresh/empty database (CI, new dev) runs every migration from V1.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

# ── Application-level JWT properties ─────────────────────────────────────────
app:
  jwt:
    # Minimum 256-bit (32-char) secret. Override via env var JWT_SECRET in production.
    secret: ${JWT_SECRET:5468576D5A7134743777217A25432A462D4A614E645267556B58703272357538}
    # Access token lifetime in milliseconds (default 24 h)
    expiration: ${JWT_EXPIRATION_MS:86400000}
    # Refresh token lifetime in milliseconds (default 7 days)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    # Browser origins allowed to call the API (comma-separated). Credentials are
    # sent from the client, so wildcard '*' is not permitted — list exact origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  user:
    address:
      max-per-user: ${USER_ADDRESS_MAX_PER_USER:5}

  order:
    # ISO-4217 currency code stamped onto every order. Single-currency for now;
    # revisit when multi-currency / per-merchant pricing is introduced.
    currency: ${ORDER_CURRENCY:USD}

  payment:
    # Active payment gateway: 'manual' (default — orders rest in PENDING_PAYMENT
    # until an admin confirms) or 'stripe'. Selects exactly one PaymentGateway bean.
    provider: ${PAYMENT_PROVIDER:manual}
    stripe:
      # Secret API key (sk_test_… / sk_live_…). Only required when provider=stripe.
      secret-key: ${STRIPE_SECRET_KEY:}
      # Signing secret (whsec_…) used to verify inbound webhook signatures.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.nexuscommerce: DEBUG
    org.springframework.security: INFO
