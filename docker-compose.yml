# Local stack: PostgreSQL 16 + the TypeScript API.
#
#   cp .env.example .env      # then set JWT_SECRET (32+ chars) and DB credentials
#   docker compose up --build
#
# API on http://localhost:8080, Postgres on localhost:5432 (change with
# API_HOST_PORT / DB_HOST_PORT). Migrations run on every start.
name: nexus-commerce-ts

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_commerce}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # UTF-8 cluster: the migrations contain non-ASCII comments.
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: nexus-commerce-api-ts:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    # These take precedence over .env: inside the network the database is "db".
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nexus_commerce}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars) in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SERVER_PORT: 8080
    ports:
      - "${API_HOST_PORT:-8080}:8080"

volumes:
  pgdata:
