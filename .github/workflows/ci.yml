name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci   # postinstall runs prisma generate
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.build.json

      - name: Test (against the service Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: npm test

      - name: Schema matches the migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
